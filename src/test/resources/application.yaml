spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE DOMAIN IF NOT EXISTS CITEXT AS VARCHAR;
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        '[format_sql]': true
  data:
    redis:
      host: localhost
      port: 6379
  main:
    allow-bean-definition-overriding: true

orasa:
  jwt:
    secret: test-secret-key-that-is-at-least-32-characters-long
    expiration: 86400000
  google:
    client-id: test-client-id
    client-secret: test-client-secret
    redirect-uri: http://localhost:8080/api/auth/google/callback
  philsms:
    api-token: test-api-token
    sender-id: Orasa
    base-url: https://dashboard.philsms.com/api/v3
  redis:
    host: localhost
    port: 6379
  payloro:
    merchant-no: test-merchant
    private-key: test-key
    base-url: https://testgateway.payloro.ph/api
    notify-url: ""
  app:
    frontend-url: http://localhost:3000
