services:
  # Global logging policy for all services
  x-logging: &logging
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

  redis:
    logging: *logging
    image: redis:alpine
    restart: always

  backend:
    logging: *logging
    image: ghcr.io/adrian92612/orasa-be:latest
    # build: .
    expose:
      - "8080"
    restart: always
    env_file:
      - .env
    environment:
      # Standard Spring Boot properties
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - FRONTEND_URL=${FRONTEND_URL:-https://orasa.app}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://orasa.app/api/auth/google/callback}
    depends_on:
      - redis

  frontend:
    logging: *logging
    image: ghcr.io/adrian92612/orasa-fe:latest
    # build: ../orasa-fe
    ports:
      - "80:80"
      - "443:443"
    restart: always
    volumes:
      - ../ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
