x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7.4-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *logging

  backend:
    image: ghcr.io/adrian92612/orasa-be:latest
    # build: .
    expose:
      - "8080"
    restart: always
    env_file:
      - ./.env
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - FRONTEND_URL=${FRONTEND_URL:-https://orasa.app}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://orasa.app/api/auth/google/callback}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

  frontend:
    image: ghcr.io/adrian92612/orasa-fe:latest
    # build: ../orasa-fe
    ports:
      - "80:80"
      - "443:443"
    restart: always
    volumes:
      - ../ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging

volumes:
  redis-data:
